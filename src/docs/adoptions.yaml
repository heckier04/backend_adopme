openapi: 3.0.0
info:
  title: AdoptMe API - Adoptions
  version: 1.0.0
  description: Endpoints para gestión de adopciones

paths:
  /api/adoptions:
    get:
      summary: Obtener todas las adopciones
      responses:
        '200':
          description: Lista de adopciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Adoption'

  /api/adoptions/{aid}:
    get:
      summary: Obtener una adopción por ID
      parameters:
        - name: aid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Adopción encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adoption'
        '404':
          description: Adopción no encontrada
    delete:
      summary: Eliminar una adopción
      parameters:
        - name: aid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Adopción eliminada
        '404':
          description: Adopción no encontrada

  /api/adoptions/{uid}/{pid}:
    post:
      summary: Crear una adopción
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
        - name: pid
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Adopción creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adoption'
        '404':
          description: Usuario o mascota no encontrada
        '400':
          description: Mascota ya adoptada

components:
  schemas:
    Adoption:
      type: object
      properties:
        _id:
          type: string
        owner:
          type: string
        pet:
          type: string
        date:
          type: string
          format: date-time
