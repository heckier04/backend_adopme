openapi: 3.0.0
info:
  title: AdoptMe API - Pets
  version: 1.0.0
  description: Endpoints para gestión de mascotas

paths:
  /api/pets:
    get:
      summary: Obtener todas las mascotas
      responses:
        '200':
          description: Lista de mascotas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      summary: Crear una mascota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetInput'
      responses:
        '201':
          description: Mascota creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

  /api/pets/{pid}:
    get:
      summary: Obtener una mascota por ID
      parameters:
        - name: pid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mascota encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Mascota no encontrada
    put:
      summary: Actualizar una mascota
      parameters:
        - name: pid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetInput'
      responses:
        '200':
          description: Mascota actualizada
    delete:
      summary: Eliminar una mascota
      parameters:
        - name: pid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mascota eliminada
        '404':
          description: Mascota no encontrada

components:
  schemas:
    Pet:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        specie:
          type: string
        birthDate:
          type: string
          format: date
        adopted:
          type: boolean
        owner:
          type: string
    PetInput:
      type: object
      properties:
        name:
          type: string
        specie:
          type: string
        birthDate:
          type: string
          format: date
      required:
        - name
        - specie
        - birthDate
